[package]
name = "suricata_pipeline"
version = "0.1.0"
edition = "2024"
description = "CLI tool to process Suricata alerts and split pcap files based on alerts"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
pcap-file = "2.0"
etherparse = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
ipnet = "2.9"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
indicatif = "0.17"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
pcap = "1.0"
crossbeam-channel = "0.5"
uuid = { version = "1.0", features = ["v4"] }
tempfile = "3.0"